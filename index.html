  <!-- 🛡️ PROTEÇÃO ANTI-BOT E ANTI-SCRAPING -->
  <script>
    // Proteção contra bots maliciosos
    (function() {
      // Detecta comportamento de bot
      const isSuspiciousBot = () => {
        // Verifica se tem webdriver (automação)
        if (navigator.webdriver) return true;
        
        // Verifica user agent suspeito
        const ua = navigator.userAgent.toLowerCase();
        const botPatterns = ['bot', 'crawler', 'spider', 'scraper', 'curl', 'wget', 'python'];
        if (botPatterns.some(pattern => ua.includes(pattern))) return true;
        
        return false;
      };

      // Proteção contra clickjacking
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }

      // Bloqueia bots suspeitos
      if (isSuspiciousBot()) {
        document.body.innerHTML = '<h1>Acesso Negado</h1><p>Entre em contato com o suporte.</p>';
        throw new Error('Bot detectado');
      }

      // Proteção contra injeção de código
      const originalLog = console.log;
      console.log = function() {
        if (arguments[0] && arguments[0].toString().includes('script')) {
          return;
        }
        originalLog.apply(console, arguments);
      };
    })();
  </script>

  <style>

      footer button { font-size: 12px; }

<body>
  <header>
    <img src="tigerclub.png" alt="Tiger Logo" />
    <h1>TIGER CLUB</h1>
  </header>

  <div id="main-content">
    <div id="tiger">
      <iframe src="https://app.tigersclub.vip/pr/Ken73590" loading="lazy" allow="clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-clipboard-write"></iframe>
    </div>
    <div id="brazz" class="hidden">
      <iframe src="https://app.bancabrasileira.com.br/pr/l9sRSoFh" loading="lazy" allow="clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-clipboard-write"></iframe>
    </div>
  </div>

  <footer>
    <div class="row">
      <button onclick="mostrar('tiger')" class="selected">
        <img src="tigerclub.png" alt="tiger" />
        Tiger Club
      </button>
      <button onclick="mostrar('brazz')">
        <img src="brasileira.png" alt="brasileira" />
        Brasileira
      </button>
      <button onclick="mostrar('suporte')">
        <i class="fab fa-whatsapp"></i>
        Suporte
      </button>
    </div>
  </footer>
  <div class="footer-bar"></div>

  <script>
    function mostrar(id) {
      if (id === 'suporte') {
        window.location.href = 'https://wa.me/message/FEVDCEIFJC3PD1?text=Ol%C3%A1%20fada%20da%20sorte%2C%20preciso%20de%20ajuda';
        return;
      }

      const sections = ['tiger', 'brazz'];
      sections.forEach(sec => {
        const el = document.getElementById(sec);
        el.classList.toggle('hidden', sec !== id);
      });

      document.querySelectorAll('footer button').forEach(btn => {
        btn.classList.remove('selected');
        if (btn.getAttribute('onclick') === `mostrar('${id}')`) {
          btn.classList.add('selected');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      mostrar('tiger');
    });
  </script>
